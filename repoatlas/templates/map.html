<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive RepoAtlas repository knowledge map">
  <title>__REPOSITORY_NAME__ · RepoAtlas</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101b33'/%3E%3Ccircle cx='20' cy='20' r='6' fill='%235de4c7'/%3E%3Ccircle cx='44' cy='20' r='6' fill='%237ea6ff'/%3E%3Ccircle cx='32' cy='44' r='6' fill='%23f5b971'/%3E%3Cpath d='M25 22l14 0M23 25l7 14M41 25l-7 14' stroke='%23dce7ff' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --page: #07101f;
      --panel: #0d1729;
      --panel-raised: #111e34;
      --detail: #f4f7fb;
      --detail-text: #172033;
      --muted: #94a3bc;
      --detail-muted: #60708b;
      --line: #2a3a55;
      --connector: #6687b8;
      --connector-strong: #5de4c7;
      --connector-width: 2px;
      --connector-path-width: 3px;
      --accent: #5de4c7;
      --accent-soft: rgba(93, 228, 199, 0.12);
      --blue: #7ea6ff;
      --orange: #f5b971;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 15% 0%, rgba(49, 87, 150, 0.22), transparent 34rem),
        var(--page);
      color: #e8eefb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    button { font: inherit; }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 16px clamp(20px, 3vw, 42px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(7, 16, 31, 0.84);
      backdrop-filter: blur(18px);
    }

    .brand, .repo-heading, .toolbar, .node-row, .stat-list { display: flex; align-items: center; }

    .brand { gap: 12px; min-width: 180px; }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(93, 228, 199, 0.45);
      border-radius: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-weight: 800;
    }

    .brand-name { font-size: 1rem; font-weight: 750; letter-spacing: 0.02em; }
    .brand-label { color: var(--muted); font-size: 0.78rem; }

    .repo-heading {
      flex: 1;
      min-width: 0;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }

    .repo-heading h1 {
      overflow: hidden;
      margin: 0;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      font-weight: 680;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .repo-heading span { color: var(--muted); }

    .stat-list { justify-content: flex-end; gap: 8px; min-width: 180px; }

    .stat {
      padding: 5px 9px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 999px;
      color: #c4d0e4;
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 390px);
      min-height: 0;
      padding: clamp(16px, 2.5vw, 32px);
      gap: 18px;
    }

    .map-panel, .detail-panel {
      min-height: 0;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .map-panel {
      overflow: hidden;
      background:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px),
        var(--panel);
      background-size: 24px 24px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 15px 18px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      background: rgba(13, 23, 41, 0.9);
    }

    .eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .panel-heading { display: grid; gap: 2px; }

    .interaction-hint {
      margin: 0;
      color: #a7b7cf;
      font-size: 0.78rem;
    }

    .toolbar { gap: 8px; }

    .toolbar button {
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-raised);
      color: #cbd6e9;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .toolbar button:hover, .toolbar button:focus-visible {
      border-color: var(--blue);
      color: #fff;
      outline: none;
    }

    .tree-scroll {
      height: calc(100vh - 160px);
      min-height: 480px;
      overflow: auto;
      padding: clamp(20px, 3vw, 34px);
    }

    .knowledge-tree, .tree-children { margin: 0; padding: 0; list-style: none; }
    .knowledge-tree { min-width: max-content; }

    .tree-children {
      position: relative;
      margin-left: 21px;
      padding-left: 26px;
      border-left: var(--connector-width) solid var(--connector);
    }

    .tree-children[hidden] { display: none; }

    .tree-item { position: relative; padding: 6px 0; }

    .tree-children > .tree-item::before,
    .tree-children > .tree-group::before {
      content: "";
      position: absolute;
      top: 24px;
      left: -26px;
      width: 20px;
      border-top: var(--connector-width) solid var(--connector);
    }

    .node-row { gap: 7px; }

    .toggle, .toggle-spacer {
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
    }

    .toggle {
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: transform 150ms ease, color 150ms ease;
    }

    .toggle[aria-expanded="true"] { transform: rotate(90deg); }
    .toggle:hover, .toggle:focus-visible { color: #fff; outline: none; }

    .node {
      display: grid;
      grid-template-columns: 32px minmax(120px, auto) auto;
      align-items: center;
      gap: 10px;
      min-height: 46px;
      padding: 7px 12px 7px 8px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(17, 30, 52, 0.94);
      color: #e7eefb;
      cursor: pointer;
      text-align: left;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    .node:hover { border-color: #526a91; transform: translateX(2px); }
    .node:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .node:hover { background: rgba(25, 43, 70, 0.98); }
    .node.ancestor {
      border-color: #4b8c89;
      background: rgba(27, 56, 67, 0.94);
    }
    .node.selected {
      border-color: var(--accent);
      background: #174a4a;
      box-shadow: 0 0 0 2px rgba(93, 228, 199, 0.18), 0 8px 24px rgba(0, 0, 0, 0.26);
      transform: translateX(3px);
    }

    .tree-children > .tree-item.active-path::before,
    .tree-children > .tree-group.active-path::before {
      border-top-color: var(--connector-strong);
      border-top-width: var(--connector-path-width);
    }

    .tree-item.active-path > .tree-children {
      border-left-color: var(--connector-strong);
      border-left-width: var(--connector-path-width);
    }

    .node-icon {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(126, 166, 255, 0.12);
      color: var(--blue);
      font: 700 0.72rem/1 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .node[data-type="repository"] .node-icon { color: var(--accent); background: var(--accent-soft); }
    .node[data-type="file"] .node-icon { color: #8eb2ff; background: rgba(126, 166, 255, 0.13); }
    .node[data-type="class"] .node-icon { color: var(--orange); background: rgba(245, 185, 113, 0.12); }
    .node[data-type="method"] .node-icon { color: #cb9cff; background: rgba(203, 156, 255, 0.12); }
    .node[data-type="function"] .node-icon { color: #78cfba; background: rgba(120, 207, 186, 0.12); }

    .node-label {
      max-width: 45vw;
      overflow: hidden;
      font: 600 0.9rem/1.3 ui-monospace, SFMono-Regular, Consolas, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .node-meta { color: var(--muted); font-size: 0.75rem; white-space: nowrap; }

    .tree-group { position: relative; padding: 8px 0; }
    .group-label { margin: 0 0 4px 36px; color: #7487a6; font-size: 0.75rem; font-weight: 750; letter-spacing: 0.08em; text-transform: uppercase; }
    .tree-group > .tree-children { margin-left: 20px; }

    .empty-state { color: var(--muted); padding: 24px; }

    .detail-panel {
      overflow: auto;
      height: calc(100vh - 128px);
      min-height: 520px;
      padding: clamp(24px, 3vw, 34px);
      background: var(--detail);
      color: var(--detail-text);
    }

    .detail-type {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 999px;
      background: #dce6f7;
      color: #425572;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .detail-panel h2 {
      margin: 18px 0 8px;
      overflow-wrap: anywhere;
      font: 720 clamp(1.35rem, 2.4vw, 1.9rem)/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .detail-signature {
      margin: 0 0 26px;
      color: #4b6285;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      overflow-wrap: anywhere;
    }

    .source-location {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin: 0 0 18px;
      color: var(--detail-muted);
      font: 0.82rem/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .source-location a {
      color: #285f9d;
      font-weight: 750;
      text-decoration: none;
    }

    .source-location a:hover,
    .source-location a:focus-visible { text-decoration: underline; }

    .detail-actions { margin: 0 0 24px; }

    .vscode-action {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 9px 15px;
      border: 1px solid #174a4a;
      border-radius: 9px;
      background: #174a4a;
      color: #fff;
      font-weight: 750;
      text-decoration: none;
      transition: background 150ms ease, box-shadow 150ms ease, transform 150ms ease;
    }

    .vscode-action:hover {
      background: #20605d;
      box-shadow: 0 7px 20px rgba(23, 74, 74, 0.2);
      transform: translateY(-1px);
    }

    .vscode-action:focus-visible { outline: 3px solid rgba(40, 95, 157, 0.32); outline-offset: 2px; }
    .vscode-action[hidden], .source-location[hidden] { display: none; }

    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .detail-card {
      min-width: 0;
      padding: 13px 14px;
      border: 1px solid #dbe3ee;
      border-radius: 11px;
      background: #fff;
    }

    .detail-card.wide { grid-column: 1 / -1; }
    .detail-card dt { margin-bottom: 5px; color: var(--detail-muted); font-size: 0.75rem; font-weight: 750; text-transform: uppercase; }
    .detail-card dd { margin: 0; overflow-wrap: anywhere; font-size: 0.9rem; }
    .detail-card code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }

    .description-block { margin-top: 28px; }
    .description-block h3 { margin: 0 0 10px; font-size: 0.83rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .description-block p { margin: 0; color: #34435c; line-height: 1.7; white-space: pre-wrap; }

    .code-viewer {
      margin-top: 28px;
      overflow: hidden;
      border: 1px solid #ced8e6;
      border-radius: 12px;
      background: #0c1525;
    }

    .code-viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 42px;
      padding: 9px 13px;
      border-bottom: 1px solid #283a55;
      color: #b9c8dc;
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .code-scroll {
      max-height: 48vh;
      overflow: auto;
      padding: 10px 0;
      color: #dbe7f8;
      font: 0.82rem/1.65 ui-monospace, SFMono-Regular, Consolas, monospace;
      tab-size: 4;
    }

    .code-line {
      display: grid;
      grid-template-columns: 48px minmax(max-content, 1fr);
      min-height: 1.65em;
      padding-right: 16px;
    }

    .code-line.active { background: rgba(93, 228, 199, 0.12); }
    .line-number { padding-right: 12px; color: #657a99; text-align: right; user-select: none; }
    .code-line.active .line-number { color: var(--accent); }
    .line-source { white-space: pre; }
    .source-unavailable { padding: 18px; color: #9bacc3; }

    @media (max-width: 900px) {
      .topbar { align-items: flex-start; flex-wrap: wrap; }
      .repo-heading { order: 3; flex-basis: 100%; justify-content: flex-start; text-align: left; }
      .stat-list { min-width: 0; }
      .workspace { grid-template-columns: 1fr; }
      .tree-scroll { height: auto; max-height: 62vh; min-height: 380px; }
      .detail-panel { height: auto; min-height: 420px; }
      .node-label { max-width: 58vw; }
    }

    @media (max-width: 560px) {
      .stat-list { display: none; }
      .workspace { padding: 10px; }
      .panel-header { align-items: flex-start; flex-direction: column; }
      .tree-scroll { padding: 16px 10px; }
      .tree-children { margin-left: 13px; padding-left: 17px; }
      .tree-children > .tree-item::before, .tree-children > .tree-group::before { left: -17px; width: 12px; }
      .node { grid-template-columns: 30px minmax(100px, auto); }
      .node-meta { display: none; }
      .node-label { max-width: 62vw; }
      .detail-grid { grid-template-columns: 1fr; }
      .detail-card.wide { grid-column: auto; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">RA</div>
        <div>
          <div class="brand-name">RepoAtlas</div>
          <div class="brand-label">Knowledge map</div>
        </div>
      </div>
      <div class="repo-heading">
        <span aria-hidden="true">/</span>
        <h1 id="repository-name">Repository</h1>
      </div>
      <div class="stat-list" id="stats" aria-label="Repository statistics"></div>
    </header>

    <main class="workspace">
      <section class="map-panel" aria-labelledby="map-title">
        <div class="panel-header">
          <div class="panel-heading">
            <p class="eyebrow" id="map-title">Repository map</p>
            <p class="interaction-hint">Click to inspect · Double-click a symbol to open in VS Code</p>
          </div>
          <div class="toolbar">
            <button type="button" id="expand-all">Expand all</button>
            <button type="button" id="collapse-all">Collapse all</button>
          </div>
        </div>
        <div class="tree-scroll">
          <ul class="knowledge-tree" id="knowledge-tree" aria-label="Repository knowledge tree"></ul>
        </div>
      </section>

      <aside class="detail-panel" id="detail-panel" aria-live="polite">
        <span class="detail-type" id="detail-type">Repository</span>
        <h2 id="detail-name">Repository</h2>
        <p class="detail-signature" id="detail-signature"></p>
        <div class="source-location" id="source-location" hidden>
          <span id="source-path"></span>
          <span aria-hidden="true">·</span>
          <a id="source-lines" href="#">L1</a>
        </div>
        <div class="detail-actions">
          <a class="vscode-action" id="open-vscode" href="#" hidden>Open in VS Code</a>
        </div>
        <dl class="detail-grid" id="detail-grid"></dl>
        <div class="description-block">
          <h3>Description</h3>
          <p id="detail-description">Select a node to inspect its details.</p>
        </div>
        <section class="code-viewer" id="code-viewer" hidden aria-labelledby="code-viewer-title">
          <div class="code-viewer-header">
            <span id="code-viewer-title">Source code</span>
            <span id="code-range"></span>
          </div>
          <div class="code-scroll" id="source-code"></div>
        </section>
      </aside>
    </main>
  </div>

  <script id="repo-data" type="application/json">__REPOSITORY_DATA__</script>
  <script>
    const repository = JSON.parse(document.getElementById("repo-data").textContent);
    const treeElement = document.getElementById("knowledge-tree");
    const typeLabels = {
      repository: "Repository",
      file: "File",
      class: "Class",
      method: "Method",
      function: "Function"
    };
    const typeIcons = { repository: "RA", file: "PY", class: "C", method: "M", function: "F" };
    const sourceFiles = new Map(repository.files.map(file => [file.path, file.source || ""]));

    function lineRange(node) {
      if (node.start_line == null) return "";
      if (node.start_line === node.end_line) return `L${node.start_line}`;
      return `L${node.start_line}–L${node.end_line}`;
    }

    function openInVSCode(uri) {
      if (!uri) return;
      try {
        const link = document.createElement("a");
        link.href = uri;
        link.style.display = "none";
        document.body.append(link);
        link.click();
        link.remove();
      } catch (error) {
        // The external protocol handoff is optional; keep the map usable on failure.
      }
    }

    function descriptor(node, children = [], expanded = false) {
      return { kind: "node", node, children, expanded };
    }

    function group(label, children) {
      return { kind: "group", label, children };
    }

    function fileDescriptor(file, index) {
      const classNames = new Set(file.classes.map(item => item.name));
      const classes = file.classes.map(item => descriptor(
        item,
        file.methods.filter(method => method.class_name === item.name).map(method => descriptor(method)),
        index === 0
      ));
      const functions = file.functions.map(item => descriptor(item));
      const unmatchedMethods = file.methods
        .filter(item => !classNames.has(item.class_name))
        .map(item => descriptor(item));
      const children = [];
      if (classes.length) children.push(group("Classes", classes));
      if (functions.length) children.push(group("Functions", functions));
      if (unmatchedMethods.length) children.push(group("Methods", unmatchedMethods));
      return descriptor(file, children, index === 0);
    }

    function repositoryDescriptor() {
      const root = {
        type: "repository",
        name: repository.name,
        path: repository.root_path,
        docstring: "Repository knowledge map generated by RepoAtlas."
      };
      return descriptor(root, repository.files.map(fileDescriptor), true);
    }

    function createGroup(item) {
      const listItem = document.createElement("li");
      listItem.className = "tree-group";
      const label = document.createElement("p");
      label.className = "group-label";
      label.textContent = item.label;
      listItem.append(label, createChildren(item.children));
      return listItem;
    }

    function createChildren(items) {
      const list = document.createElement("ul");
      list.className = "tree-children";
      items.forEach(item => list.append(item.kind === "group" ? createGroup(item) : createNode(item)));
      return list;
    }

    function createNode(item) {
      const listItem = document.createElement("li");
      listItem.className = "tree-item";
      const row = document.createElement("div");
      row.className = "node-row";

      let childrenElement = null;
      if (item.children.length) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "toggle";
        toggle.textContent = "›";
        toggle.setAttribute("aria-label", `Toggle ${item.node.name}`);
        toggle.setAttribute("aria-expanded", String(item.expanded));
        toggle.addEventListener("click", () => {
          const expanded = toggle.getAttribute("aria-expanded") === "true";
          toggle.setAttribute("aria-expanded", String(!expanded));
          childrenElement.hidden = expanded;
        });
        row.append(toggle);
      } else {
        const spacer = document.createElement("span");
        spacer.className = "toggle-spacer";
        row.append(spacer);
      }

      const button = document.createElement("button");
      button.type = "button";
      button.className = "node";
      button.dataset.type = item.node.type;
      button.innerHTML = `<span class="node-icon">${typeIcons[item.node.type]}</span>`;

      const label = document.createElement("span");
      label.className = "node-label";
      label.textContent = item.node.signature || item.node.path || item.node.name;
      const meta = document.createElement("span");
      meta.className = "node-meta";
      meta.textContent = lineRange(item.node) || typeLabels[item.node.type];
      button.append(label, meta);
      button.addEventListener("click", () => selectNode(item.node, button));
      if (["class", "method", "function"].includes(item.node.type)) {
        button.addEventListener("dblclick", () => openInVSCode(item.node.vscode_uri));
        button.title = "Double-click to open in VS Code";
      }
      row.append(button);
      listItem.append(row);

      if (item.children.length) {
        childrenElement = createChildren(item.children);
        childrenElement.hidden = !item.expanded;
        listItem.append(childrenElement);
      }
      return listItem;
    }

    function detailCard(label, value, wide = false) {
      const wrapper = document.createElement("div");
      wrapper.className = `detail-card${wide ? " wide" : ""}`;
      const term = document.createElement("dt");
      term.textContent = label;
      const description = document.createElement("dd");
      const code = document.createElement("code");
      code.textContent = value;
      description.append(code);
      wrapper.append(term, description);
      return wrapper;
    }

    function highlightAncestry(button) {
      document.querySelectorAll(".node.selected, .node.ancestor").forEach(item => {
        item.classList.remove("selected", "ancestor");
      });
      document.querySelectorAll(".tree-item.active-path").forEach(item => item.classList.remove("active-path"));
      if (!button) return;

      button.classList.add("selected");
      let branch = button.closest(".tree-item");
      while (branch) {
        branch.classList.add("active-path");
        const branchNode = branch.querySelector(":scope > .node-row > .node");
        if (branchNode && branchNode !== button) branchNode.classList.add("ancestor");
        branch = branch.parentElement.closest(".tree-item");
      }
    }

    function renderSource(node) {
      const viewer = document.getElementById("code-viewer");
      const code = document.getElementById("source-code");
      const source = node.path ? sourceFiles.get(node.path) : null;
      viewer.hidden = !node.path;
      code.replaceChildren();
      document.getElementById("code-range").textContent = lineRange(node);
      if (!node.path) return;

      if (!source) {
        const unavailable = document.createElement("div");
        unavailable.className = "source-unavailable";
        unavailable.textContent = "Source unavailable.";
        code.append(unavailable);
        return;
      }

      const startLine = node.start_line || 0;
      const endLine = node.end_line || startLine;
      const fragment = document.createDocumentFragment();
      source.replace(/\r\n/g, "\n").split("\n").forEach((text, index) => {
        const lineNumber = index + 1;
        const row = document.createElement("div");
        row.className = "code-line";
        if (lineNumber >= startLine && lineNumber <= endLine) row.classList.add("active");
        const number = document.createElement("span");
        number.className = "line-number";
        number.textContent = String(lineNumber);
        const sourceText = document.createElement("span");
        sourceText.className = "line-source";
        sourceText.textContent = text || " ";
        row.append(number, sourceText);
        fragment.append(row);
      });
      code.append(fragment);
      const activeLine = code.querySelector(".code-line.active");
      if (activeLine) activeLine.scrollIntoView({ block: "center" });
    }

    function selectNode(node, button) {
      highlightAncestry(button);

      document.getElementById("detail-type").textContent = typeLabels[node.type];
      document.getElementById("detail-name").textContent = node.name;
      const signature = document.getElementById("detail-signature");
      signature.textContent = node.signature || "";
      signature.hidden = !node.signature;

      const sourceLocation = document.getElementById("source-location");
      const sourceLines = document.getElementById("source-lines");
      sourceLocation.hidden = !node.vscode_uri;
      document.getElementById("source-path").textContent = node.path || "";
      sourceLines.textContent = lineRange(node);
      sourceLines.href = node.vscode_uri || "#";

      const vscodeAction = document.getElementById("open-vscode");
      vscodeAction.hidden = !node.vscode_uri;
      vscodeAction.href = node.vscode_uri || "#";

      const grid = document.getElementById("detail-grid");
      grid.replaceChildren();
      if (node.type === "repository") grid.append(detailCard("Root path", node.path, true));
      if (node.class_name) grid.append(detailCard("Class", node.class_name));
      if (Array.isArray(node.parameters)) {
        grid.append(detailCard("Parameters", node.parameters.length ? node.parameters.join(", ") : "None", true));
      }
      document.getElementById("detail-description").textContent = node.docstring || "No description available.";
      renderSource(node);
    }

    function setAllBranches(expanded) {
      document.querySelectorAll(".toggle").forEach(toggle => {
        toggle.setAttribute("aria-expanded", String(expanded));
        const row = toggle.closest(".node-row");
        const children = row.nextElementSibling;
        if (children) children.hidden = !expanded;
      });
    }

    const functionCount = repository.files.reduce((total, file) => total + file.functions.length, 0);
    const classCount = repository.files.reduce((total, file) => total + file.classes.length, 0);
    const symbolCount = repository.files.reduce(
      (total, file) => total + file.classes.length + file.functions.length + file.methods.length,
      0
    );
    const stats = [
      `${repository.files.length} files`,
      `${classCount} classes`,
      `${functionCount} functions`,
      `${symbolCount} symbols`
    ];
    document.getElementById("stats").replaceChildren(...stats.map(text => {
      const item = document.createElement("span");
      item.className = "stat";
      item.textContent = text;
      return item;
    }));
    document.getElementById("repository-name").textContent = repository.name;

    treeElement.append(createNode(repositoryDescriptor()));
    if (!repository.files.length) {
      const empty = document.createElement("li");
      empty.className = "empty-state";
      empty.textContent = "No Python files were detected.";
      treeElement.append(empty);
    }

    document.getElementById("expand-all").addEventListener("click", () => setAllBranches(true));
    document.getElementById("collapse-all").addEventListener("click", () => setAllBranches(false));
    ["open-vscode", "source-lines"].forEach(id => {
      document.getElementById(id).addEventListener("click", event => {
        event.preventDefault();
        openInVSCode(event.currentTarget.href);
      });
    });
    selectNode(repositoryDescriptor().node, document.querySelector('.node[data-type="repository"]'));
  </script>
</body>
</html>
