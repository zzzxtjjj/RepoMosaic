<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__REPOSITORY_NAME__ · RepoMosaic</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f7f8fa; --panel: #ffffff; --text: #172033; --muted: #667085;
      --border: #e4e7ec; --accent: #2563eb; --selected: #eff6ff;
      --connector: #4f74ad; --connector-trunk: #315f9e;
      --connector-symbol: #6574b8; --connector-active: #1d4ed8;
      --connector-width: 2.5px; --connector-trunk-width: 3px;
      --connector-path-width: 4px;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text); background: var(--page);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid #93b4ff; outline-offset: 3px;
    }
    [hidden] { display: none !important; }
    .topbar { height: 64px; display: flex; align-items: center; gap: 22px; padding: 0 24px; background: white; border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 750; flex-shrink: 0; }
    .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; color: white; background: var(--accent); border-radius: 8px; font-size: 12px; }
    .repository-heading { min-width: 100px; max-width: 190px; }
    .repository-heading strong, .repository-heading small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .repository-heading small { color: var(--muted); font-size: 11px; }
    .search-wrap { position: relative; flex: 1; max-width: 480px; min-width: 180px; margin: 0 auto; }
    #repository-search { width: 100%; height: 36px; border: 1px solid var(--border); background: #f9fafb; border-radius: 8px; padding: 0 12px; }
    .search-results { position: absolute; top: 42px; width: 100%; max-height: 360px; overflow: auto; background: white; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 30px #1720331a; z-index: 10; padding: 5px; }
    .search-result { display: block; width: 100%; text-align: left; background: white; border: 0; padding: 9px; border-radius: 6px; overflow-wrap: anywhere; }
    .search-result:hover { background: var(--selected); }
    .search-result small { display: block; color: var(--muted); }
    .toolbar { display: flex; gap: 5px; align-items: center; }
    .control { border: 1px solid var(--border); background: white; padding: 6px 10px; border-radius: 7px; font-size: 12px; white-space: nowrap; }
    .control:hover { background: #f1f5f9; border-color: #b3c0d0; }
    .workspace { height: calc(100dvh - 64px); display: grid; grid-template-columns: minmax(0, 2fr) minmax(330px, 1fr); }
    .workspace.details-collapsed { grid-template-columns: minmax(0, 1fr); }
    .workspace.details-collapsed .detail-panel { display: none; }
    .canvas-panel { min-width: 0; position: relative; display: flex; flex-direction: column; overflow: hidden; }
    .canvas-heading { padding: 20px 24px 14px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    h1 { margin: 0; font-size: 17px; letter-spacing: -.3px; }
    .subtle { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .filters { display: flex; gap: 5px; flex-wrap: wrap; }
    .filter { background: white; border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; font-size: 12px; }
    .filter[aria-pressed="true"] { color: #244579; border-color: #b9ccea; background: #eff6ff; }
    .filter[aria-pressed="false"] { color: var(--muted); }
    #knowledge-canvas { position: relative; flex: 1; overflow: hidden; touch-action: none; cursor: grab; background-image: radial-gradient(#dce2eb .8px, transparent .8px); background-size: 20px 20px; }
    #knowledge-canvas.panning { cursor: grabbing; }
    #graph-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
    #connectors { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
    .connector { fill: none; stroke: var(--connector); stroke-width: var(--connector-width); vector-effect: non-scaling-stroke; }
    .connector[data-target-type="package"], .connector[data-target-type="file"] { stroke: var(--connector-trunk); stroke-width: var(--connector-trunk-width); }
    .connector[data-target-type="function"], .connector[data-target-type="method"] { stroke: var(--connector-symbol); }
    .connector.active-path { stroke: var(--connector-active); stroke-width: var(--connector-path-width); }
    .node-card { position: absolute; width: 224px; height: 88px; }
    .node { width: 100%; height: 100%; text-align: left; border: 1px solid #ced5df; background: white; border-radius: 11px; padding: 11px 15px; box-shadow: 0 2px 4px #17203306; transition: background .15s, border-color .15s; }
    .node:hover { background: #f8fafc; border-color: #8294ad; }
    .node.selected { background: var(--selected); border: 2px solid var(--accent); box-shadow: 0 3px 12px #2563eb1a; padding: 10px 14px; }
    .node.ancestor { border-color: #7fa7ed; background: #f5f9ff; }
    .node.match { box-shadow: 0 0 0 3px #f1c96a; }
    .node.dimmed { opacity: .35; }
    .node-label { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-top: 4px; font-size: 14px; font-weight: 650; }
    .node-meta { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
    .badge { display: inline-block; border-radius: 4px; padding: 1px 5px; font-size: 9px; font-weight: 750; letter-spacing: .7px; text-transform: uppercase; background: #edf0f4; color: #475467; }
    [data-type="repository"] .badge { background: #e8efff; color: #245ac6; }
    [data-type="class"] .badge { background: #f2edfb; color: #72509d; }
    [data-type="function"] .badge { background: #e7f4f0; color: #287464; }
    [data-type="method"] .badge { background: #fbf1df; color: #8a6427; }
    [data-type="package"] .node { border-style: dashed; background: #f7f9fc; }
    .branch-toggle { position: absolute; right: -12px; top: 32px; width: 24px; height: 24px; border: 1px solid #aebacb; background: white; border-radius: 50%; padding: 0; font-size: 16px; }
    .canvas-bottom { position: absolute; bottom: 18px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: end; pointer-events: none; gap: 12px; }
    .canvas-bottom .toolbar { pointer-events: auto; padding: 5px; background: white; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 3px 10px #17203309; }
    #zoom-level { min-width: 44px; text-align: center; color: var(--muted); font-size: 12px; }
    #canvas-status { background: #f7f8fae6; border-radius: 6px; padding: 4px 7px; }
    .empty-state { position: absolute; top: 16px; left: 24px; color: var(--muted); }
    .detail-panel { background: white; border-left: 1px solid var(--border); overflow: auto; padding: 22px 24px 36px; }
    .detail-eyebrow { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 24px; }
    #detail-name { font-size: 23px; line-height: 1.3; margin: 8px 0; overflow-wrap: anywhere; letter-spacing: -.5px; }
    .detail-signature { color: var(--muted); font: 12px/1.6 ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
    .source-location { font-size: 12px; color: var(--muted); margin: 15px 0; overflow-wrap: anywhere; }
    #source-path, #source-lines { display: block; }
    #source-lines { margin-top: 4px; font-weight: 600; }
    .vscode-action { display: inline-block; color: var(--accent); background: #f4f8ff; border: 1px solid #cbdbfa; text-decoration: none; padding: 7px 11px; border-radius: 7px; font-size: 12px; }
    .detail-grid { font-size: 12px; }
    .detail-grid dt { color: var(--muted); margin-top: 10px; }
    .detail-grid dd { margin: 2px 0; overflow-wrap: anywhere; }
    .description-block { border-top: 1px solid var(--border); padding-top: 20px; margin-top: 24px; }
    h3 { font-size: 13px; margin: 0 0 9px; }
    #detail-description, #semantic-summary-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.75; margin: 0; font-size: 13px; }
    .missing-description { color: var(--muted); font-size: 12px !important; }
    .semantic-summary { margin-top: 22px; padding: 16px; border: 1px solid #d4e3fc; border-radius: 10px; background: #f5f9ff; }
    .semantic-summary h3 { color: #2457a5; }
    .code-viewer { margin-top: 24px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .code-viewer-header { display: flex; justify-content: space-between; padding: 10px 13px; background: #f3f5f8; border-bottom: 1px solid var(--border); font-size: 12px; }
    #code-range { color: var(--muted); }
    .code-scroll { overflow: auto; max-height: 65vh; background: #fafbfc; padding: 12px 0; font: 12px/1.8 ui-monospace, SFMono-Regular, Consolas, monospace; tab-size: 4; }
    .code-line { display: flex; min-width: max-content; padding-right: 16px; }
    .line-number { width: 48px; flex: 0 0 48px; text-align: right; padding-right: 12px; color: #8894a7; user-select: none; border-right: 1px solid #e4e7ec; margin-right: 12px; }
    .line-source { white-space: pre; }
    .source-unavailable { color: var(--muted); padding: 12px; }
    @media (max-width: 1200px) {
      .topbar { gap: 12px; padding: 0 16px; }
      .repository-heading { max-width: 130px; }
      .canvas-heading { align-items: flex-start; flex-direction: column; padding: 16px; gap: 10px; }
      .detail-panel { padding: 20px; }
    }
    @media (max-width: 850px) {
      .repository-heading { display: none; }
      .topbar { flex-wrap: wrap; height: 108px; padding: 10px; gap: 8px; }
      .search-wrap { max-width: none; }
      .workspace { height: calc(100dvh - 108px); grid-template-columns: minmax(0, 1fr) 300px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">RM</span>RepoMosaic</div>
    <div class="repository-heading"><strong id="repository-name">Repository</strong><small id="repository-path"></small></div>
    <div class="search-wrap">
      <input id="repository-search" type="search" placeholder="Search files, classes, functions..." aria-label="Search repository" aria-controls="search-results" autocomplete="off">
      <div id="search-results" class="search-results" hidden aria-label="Search results"></div>
    </div>
    <div class="toolbar">
      <button class="control" id="expand-all" title="Expand all branches">Expand all</button>
      <button class="control" id="collapse-all" title="Collapse file branches">Collapse all</button>
      <button class="control" id="fit-view" title="Fit the complete visible graph">Fit View</button>
      <button class="control" id="toggle-details" aria-expanded="true" title="Toggle symbol detail panel">Details</button>
    </div>
  </header>
  <main class="workspace" id="workspace">
    <section class="canvas-panel" aria-labelledby="map-title">
      <div class="canvas-heading">
        <div><h1 id="map-title">Repository Knowledge Canvas</h1><p class="subtle">Repository intelligence for developers and coding agents</p></div>
        <div class="filters" aria-label="Node type filters">
          <button class="filter" data-filter="file" aria-pressed="true">Files</button>
          <button class="filter" data-filter="class" aria-pressed="true">Classes</button>
          <button class="filter" data-filter="function" aria-pressed="true">Functions</button>
          <button class="filter" data-filter="method" aria-pressed="true">Methods</button>
        </div>
      </div>
      <div id="knowledge-canvas" tabindex="0" aria-label="Knowledge canvas. Use the wheel or drag to pan; hold Control while using the wheel to zoom.">
        <div id="graph-stage"><svg id="connectors" aria-hidden="true"></svg><div id="knowledge-tree" aria-label="Repository nodes"></div></div>
        <p class="empty-state" id="empty-state" hidden>No Python files were detected.</p>
      </div>
      <div class="canvas-bottom">
        <p class="subtle" id="canvas-status" role="status"></p>
        <div class="toolbar">
          <button class="control" id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
          <span id="zoom-level">100%</span>
          <button class="control" id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
          <button class="control" id="reset-view" title="Reset to readable scale">Reset</button>
          <button class="control" id="focus-selected" title="Center selected node">Locate</button>
        </div>
      </div>
    </section>
    <aside class="detail-panel" id="detail-panel" aria-label="Symbol detail">
      <div class="detail-eyebrow">Understand · Locate · Edit</div>
      <span class="badge" id="detail-type">Repository</span>
      <h2 id="detail-name">Repository</h2>
      <p class="detail-signature" id="detail-signature"></p>
      <div class="source-location" id="source-location"><span id="source-path"></span><span id="source-lines"></span></div>
      <a class="vscode-action" id="open-vscode" href="#" hidden>Open File in VS Code</a>
      <dl class="detail-grid" id="detail-grid"></dl>
      <section class="description-block"><h3>Description</h3><p id="detail-description"></p></section>
      <section class="semantic-summary" id="semantic-summary" hidden><h3>AI Summary</h3><p id="semantic-summary-text"></p></section>
      <section class="code-viewer" id="code-viewer" hidden>
        <div class="code-viewer-header"><strong>Source Code</strong><span id="code-range"></span></div>
        <div class="code-scroll" id="source-code" tabindex="0" aria-label="Source code"></div>
      </section>
    </aside>
  </main>
  <script id="repo-data" type="application/json">__REPOSITORY_DATA__</script>
  <script>
    "use strict";
    const repository = JSON.parse(document.getElementById("repo-data").textContent);
    const $ = id => document.getElementById(id);
    const canvas = $("knowledge-canvas"), stage = $("graph-stage"), treeElement = $("knowledge-tree");
    const svg = $("connectors"), records = [], sourceFiles = new Map(repository.files.map(file => [file.path, file.source || ""]));
    const enabledTypes = new Set(["file", "class", "function", "method"]);
    const WIDTH = 224, HEIGHT = 88, LEVEL = 284, GAP = 24, CONNECTOR_BEND = 30;
    const FIT_MAX_SCALE = 1.12, DEFAULT_MIN_SCALE = .82, READABLE_NODE_LIMIT = 80;
    const FIT_PADDING_X = 36, FIT_PADDING_Y = 48;
    let selected = null, query = "", visible = [], edges = [], bounds = { width: WIDTH, height: HEIGHT };
    let camera = { x: 30, y: 30, scale: 1 }, drag = null;

    // 仅建立一次节点及父子关系，移动画布时无需重建 DOM。
    function record(node, parent = null) {
      const item = { id: records.length, node, parent, children: [], expanded: true, x: 0, y: 0 };
      records.push(item);
      if (parent) parent.children.push(item);
      return item;
    }
    const root = record({ type: "repository", name: repository.name, path: repository.root_path, docstring: "" });
    const packages = new Map();
    repository.files.forEach(file => {
      const directory = file.path.includes("/") ? file.path.slice(0, file.path.lastIndexOf("/")) : "";
      let parent = root;
      if (directory) {
        if (!packages.has(directory)) {
          const packageItem = record({ type: "package", name: directory + "/", path: directory }, root);
          packageItem.expanded = repository.files.length <= 18;
          packages.set(directory, packageItem);
        }
        parent = packages.get(directory);
      }
      const fileItem = record(file, parent);
      fileItem.expanded = repository.files.length <= 8;
      const classes = new Map();
      file.classes.forEach(node => classes.set(node.name, record(node, fileItem)));
      file.methods.forEach(node => record(node, classes.get(node.class_name) || fileItem));
      file.functions.forEach(node => record(node, fileItem));
    });

    function lineRange(node) {
      if (node.start_line == null) return "";
      return node.start_line === node.end_line ? "L" + node.start_line : "L" + node.start_line + "–L" + node.end_line;
    }
    function isEnabled(item) {
      return ["repository", "package"].includes(item.node.type) || enabledTypes.has(item.node.type);
    }
    function matches(item) {
      return (item.node.name + " " + (item.node.signature || "") + " " + (item.node.path || "")).toLowerCase().includes(query);
    }
    function createNode(item) {
      const card = document.createElement("div");
      card.className = "node-card"; card.dataset.type = item.node.type;
      const button = document.createElement("button");
      button.className = "node"; button.dataset.type = item.node.type;
      button.title = item.node.signature || item.node.path || item.node.name;
      const badge = document.createElement("span"); badge.className = "badge"; badge.textContent = item.node.type;
      const label = document.createElement("span"); label.className = "node-label"; label.textContent = item.node.signature || item.node.name;
      const meta = document.createElement("span"); meta.className = "node-meta";
      meta.textContent = lineRange(item.node) || item.children.length + (item.node.type === "repository" ? " branches" : " files");
      if (item.node.type === "file") meta.textContent = (item.node.classes.length + item.node.methods.length + item.node.functions.length) + " symbols";
      button.append(badge, label, meta); card.append(button);
      button.addEventListener("click", () => selectNode(item));
      if (item.children.length) {
        const toggle = document.createElement("button"); toggle.className = "branch-toggle";
        toggle.title = "Expand or collapse " + item.node.name; toggle.setAttribute("aria-label", toggle.title);
        toggle.addEventListener("click", () => { item.expanded = !item.expanded; layout(); });
        card.append(toggle); item.toggle = toggle;
      }
      item.element = card; item.button = button; treeElement.append(card);
    }
    records.forEach(createNode);

    // 子树高度决定纵向空间，层级决定横向列；隐藏类型时保留其可见后代。
    function layout() {
      visible = []; edges = [];
      const children = new Map(records.map(item => [item, []]));
      function collect(item, parent) {
        const shown = isEnabled(item);
        if (shown) { visible.push(item); if (parent) children.get(parent).push(item); }
        if (item.expanded || !shown) item.children.forEach(child => collect(child, shown ? item : parent));
      }
      collect(root, null);
      const visibleSet = new Set(visible);
      records.forEach(item => {
        item.element.hidden = !visibleSet.has(item);
        if (item.toggle) { item.toggle.textContent = item.expanded ? "−" : "+"; item.toggle.setAttribute("aria-expanded", String(item.expanded)); }
      });
      let maxX = 0;
      function place(item, depth, top) {
        const descendants = children.get(item);
        let cursor = top;
        descendants.forEach(child => {
          const height = place(child, depth + 1, cursor);
          edges.push({ parent: item, child }); cursor += height + GAP;
        });
        const height = Math.max(HEIGHT, cursor - top - (descendants.length ? GAP : 0));
        item.x = depth * LEVEL; item.y = top + (height - HEIGHT) / 2;
        item.element.style.transform = "translate(" + item.x + "px," + item.y + "px)";
        maxX = Math.max(maxX, item.x + WIDTH);
        return height;
      }
      bounds = { height: place(root, 0, 0), width: maxX };
      stage.style.width = bounds.width + "px"; stage.style.height = bounds.height + "px";
      svg.setAttribute("width", bounds.width); svg.setAttribute("height", bounds.height);
      const fragment = document.createDocumentFragment();
      edges.forEach(edge => {
        const x = edge.parent.x + WIDTH, y = edge.parent.y + HEIGHT / 2;
        const endX = edge.child.x, endY = edge.child.y + HEIGHT / 2;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", "M" + x + "," + y + " C" + (x + CONNECTOR_BEND) + "," + y + " " + (endX - CONNECTOR_BEND) + "," + endY + " " + endX + "," + endY);
        path.setAttribute("class", "connector"); edge.element = path; fragment.append(path);
        path.dataset.targetType = edge.child.node.type;
      });
      svg.replaceChildren(fragment);
      highlightAncestry();
      $("canvas-status").textContent = visible.length + " visible nodes · Drag to pan · Scroll to zoom";
    }
    function highlightAncestry() {
      const ancestry = new Set();
      for (let item = selected; item; item = item.parent) ancestry.add(item);
      records.forEach(item => {
        item.button.classList.toggle("selected", item === selected);
        item.button.classList.toggle("ancestor", item !== selected && ancestry.has(item));
        item.button.classList.toggle("match", Boolean(query) && matches(item));
        item.button.classList.toggle("dimmed", Boolean(query) && !matches(item));
        item.button.setAttribute("aria-pressed", String(item === selected));
      });
      edges.forEach(edge => edge.element.classList.toggle("active-path", ancestry.has(edge.child) && ancestry.has(edge.parent)));
    }
    function renderSource(node) {
      const viewer = $("code-viewer"), code = $("source-code"), source = sourceFiles.get(node.path);
      viewer.hidden = !["file", "class", "function", "method"].includes(node.type);
      code.replaceChildren(); $("code-range").textContent = lineRange(node);
      if (viewer.hidden) return;
      if (!source) { const message = document.createElement("div"); message.className = "source-unavailable"; message.textContent = "Source unavailable."; code.append(message); return; }
      const lines = source.replace(/\r\n/g, "\n").split("\n");
      if (lines[lines.length - 1] === "") lines.pop();
      const start = node.type === "file" ? 1 : Math.max(1, node.start_line || 1);
      const end = node.type === "file" ? lines.length : Math.min(lines.length, node.end_line || start);
      const fragment = document.createDocumentFragment();
      for (let index = start - 1; index < end; index++) {
        const row = document.createElement("div"); row.className = "code-line";
        const number = document.createElement("span"); number.className = "line-number"; number.textContent = index + 1;
        const text = document.createElement("span"); text.className = "line-source"; text.textContent = lines[index] || " ";
        row.append(number, text); fragment.append(row);
      }
      code.append(fragment); code.scrollTop = 0; code.scrollLeft = 0;
    }
    function selectNode(item) {
      selected = item; highlightAncestry();
      const node = (item || root).node;
      $("detail-name").textContent = node.name; $("detail-type").textContent = node.type;
      $("detail-signature").textContent = node.signature || ""; $("detail-signature").hidden = !node.signature;
      $("source-path").textContent = node.path || ""; $("source-lines").textContent = lineRange(node);
      const action = $("open-vscode"); action.hidden = node.type !== "file" || !node.vscode_uri;
      if (action.hidden) action.removeAttribute("href"); else action.href = node.vscode_uri;
      const grid = $("detail-grid"); grid.replaceChildren();
      if (node.parameters) {
        const term = document.createElement("dt"); term.textContent = "Parameters";
        const value = document.createElement("dd"); value.textContent = node.parameters.join(", ") || "None"; grid.append(term, value);
      }
      const description = node.type === "file" ? node.module_docstring : node.docstring;
      $("detail-description").textContent = description || "No source description.";
      $("detail-description").classList.toggle("missing-description", !description);
      const semanticSummary = $("semantic-summary");
      semanticSummary.hidden = !node.semantic_summary;
      $("semantic-summary-text").textContent = node.semantic_summary || "";
      renderSource(node);
    }
    function applyCamera() {
      stage.style.transform = "translate(" + camera.x + "px," + camera.y + "px) scale(" + camera.scale + ")";
      $("zoom-level").textContent = Math.round(camera.scale * 100) + "%";
    }
    function fittedScale() {
      const availableWidth = Math.max(1, canvas.clientWidth - FIT_PADDING_X);
      const availableHeight = Math.max(1, canvas.clientHeight - FIT_PADDING_Y);
      return Math.min(FIT_MAX_SCALE, availableWidth / bounds.width, availableHeight / bounds.height);
    }
    function centerView(scale) {
      camera.scale = scale;
      camera.x = (canvas.clientWidth - bounds.width * scale) / 2;
      camera.y = (canvas.clientHeight - bounds.height * scale) / 2; applyCamera();
    }
    function fitView() {
      centerView(fittedScale());
    }
    function resetView() {
      layout();
      const scale = fittedScale();
      centerView(visible.length <= READABLE_NODE_LIMIT ? Math.max(DEFAULT_MIN_SCALE, scale) : scale);
    }
    function focusNode(item) {
      if (!item) return;
      enabledTypes.add(item.node.type);
      document.querySelectorAll("[data-filter]").forEach(button => button.setAttribute("aria-pressed", String(enabledTypes.has(button.dataset.filter))));
      for (let parent = item.parent; parent; parent = parent.parent) parent.expanded = true;
      layout();
      camera.scale = Math.max(.8, camera.scale);
      camera.x = canvas.clientWidth / 2 - (item.x + WIDTH / 2) * camera.scale;
      camera.y = canvas.clientHeight / 2 - (item.y + HEIGHT / 2) * camera.scale; applyCamera();
    }
    function zoom(factor, x = canvas.clientWidth / 2, y = canvas.clientHeight / 2) {
      const scale = Math.min(2, Math.max(.025, camera.scale * factor));
      camera.x = x - (x - camera.x) * scale / camera.scale;
      camera.y = y - (y - camera.y) * scale / camera.scale; camera.scale = scale; applyCamera();
    }
    function wheelDelta(event, value) {
      const multiplier = event.deltaMode === 1 ? 18 : event.deltaMode === 2 ? canvas.clientHeight : 1;
      return value * multiplier;
    }
    function search() {
      query = $("repository-search").value.trim().toLowerCase();
      const results = $("search-results"); results.replaceChildren(); results.hidden = !query;
      if (!query) { highlightAncestry(); return; }
      const matchesList = records.filter(item => matches(item));
      matchesList.forEach(item => { for (let parent = item.parent; parent; parent = parent.parent) parent.expanded = true; });
      layout();
      matchesList.slice(0, 60).forEach(item => {
        const button = document.createElement("button"); button.className = "search-result";
        const label = document.createElement("span"); label.textContent = item.node.signature || item.node.name;
        const meta = document.createElement("small"); meta.textContent = item.node.type + " · " + (item.node.path || "");
        button.append(label, meta);
        button.addEventListener("click", () => { selectNode(item); focusNode(item); results.hidden = true; item.button.focus({ preventScroll: true }); });
        results.append(button);
      });
      if (!matchesList.length) results.textContent = "No matching nodes.";
      $("canvas-status").textContent = matchesList.length + " matches" + (matchesList.length > 60 ? " · First 60 listed; narrow your search" : "");
    }
    function setAllBranches(expanded) {
      records.forEach(item => { item.expanded = expanded || ["repository", "package"].includes(item.node.type); });
      layout(); fitView();
    }
    $("repository-name").textContent = repository.name; $("repository-path").textContent = repository.root_path;
    $("repository-path").title = repository.root_path;
    $("empty-state").hidden = repository.files.length > 0;
    $("expand-all").addEventListener("click", () => setAllBranches(true));
    $("collapse-all").addEventListener("click", () => setAllBranches(false));
    $("fit-view").addEventListener("click", fitView);
    $("reset-view").addEventListener("click", resetView);
    $("focus-selected").addEventListener("click", () => focusNode(selected || root));
    $("zoom-in").addEventListener("click", () => zoom(1.2));
    $("zoom-out").addEventListener("click", () => zoom(1 / 1.2));
    $("toggle-details").addEventListener("click", event => {
      const collapsed = $("workspace").classList.toggle("details-collapsed");
      event.currentTarget.setAttribute("aria-expanded", String(!collapsed));
    });
    document.querySelectorAll("[data-filter]").forEach(button => button.addEventListener("click", () => {
      const type = button.dataset.filter;
      if (enabledTypes.has(type)) enabledTypes.delete(type); else enabledTypes.add(type);
      button.setAttribute("aria-pressed", String(enabledTypes.has(type))); layout();
    }));
    let searchTimer;
    $("repository-search").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(search, 120); });
    $("repository-search").addEventListener("keydown", event => { if (event.key === "ArrowDown") { event.preventDefault(); $("search-results").querySelector("button")?.focus(); } });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") { clearTimeout(searchTimer); $("repository-search").value = ""; query = ""; $("search-results").hidden = true; selectNode(null); }
    });
    document.addEventListener("click", event => { if (!event.target.closest(".search-wrap")) $("search-results").hidden = true; });
    canvas.addEventListener("wheel", event => {
      event.preventDefault();
      if (event.ctrlKey) {
        const rect = canvas.getBoundingClientRect();
        zoom(Math.exp(-wheelDelta(event, event.deltaY) * .0015), event.clientX - rect.left, event.clientY - rect.top);
        return;
      }
      if (event.shiftKey) {
        camera.x -= wheelDelta(event, event.deltaY || event.deltaX);
      } else {
        camera.x -= wheelDelta(event, event.deltaX);
        camera.y -= wheelDelta(event, event.deltaY);
      }
      applyCamera();
    }, { passive: false });
    canvas.addEventListener("pointerdown", event => {
      if (event.button !== 0 || event.target.closest("button")) return;
      drag = { x: event.clientX, y: event.clientY, cameraX: camera.x, cameraY: camera.y };
      canvas.setPointerCapture(event.pointerId); canvas.classList.add("panning");
    });
    canvas.addEventListener("pointermove", event => {
      if (!drag) return;
      camera.x = drag.cameraX + event.clientX - drag.x; camera.y = drag.cameraY + event.clientY - drag.y; applyCamera();
    });
    function endPan() { drag = null; canvas.classList.remove("panning"); }
    canvas.addEventListener("pointerup", endPan); canvas.addEventListener("pointercancel", endPan);
    canvas.addEventListener("keydown", event => {
      if (event.target !== canvas) return;
      const delta = { ArrowLeft: [50, 0], ArrowRight: [-50, 0], ArrowUp: [0, 50], ArrowDown: [0, -50] }[event.key];
      if (delta) { event.preventDefault(); camera.x += delta[0]; camera.y += delta[1]; applyCamera(); }
    });
    // 外部协议仅对文件开放；浏览器拒绝时页面仍可继续使用。
    $("open-vscode").addEventListener("click", event => {
      event.preventDefault();
      if (!selected || selected.node.type !== "file") return;
      try { const link = document.createElement("a"); link.href = selected.node.vscode_uri; document.body.append(link); link.click(); link.remove(); } catch (_) { /* Optional editor handoff. */ }
    });
    new ResizeObserver(() => applyCamera()).observe(canvas);
    layout(); selectNode(root);
    requestAnimationFrame(resetView);
  </script>
</body>
</html>
