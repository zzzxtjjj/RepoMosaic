[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoatlas"
dynamic = ["version"]
description = "Human-first and agent-readable repository knowledge maps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
repoatlas = "repoatlas.cli:main"

[tool.setuptools.dynamic]
version = {attr = "repoatlas.__version__"}

[tool.setuptools.packages.find]
include = ["repoatlas*"]

[tool.setuptools.package-data]
"repoatlas.rendering" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
