[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repomosaic"
dynamic = ["version"]
description = "Repository intelligence for developers and coding agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "keyring>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
mcp = [
    "mcp>=2,<3",
]

[project.scripts]
repomosaic = "repomosaic.cli:main"
repomosaic-mcp = "repomosaic.mcp_server:main"

[tool.setuptools.dynamic]
version = {attr = "repomosaic.__version__"}

[tool.setuptools.packages.find]
include = ["repomosaic*"]

[tool.setuptools.package-data]
"repomosaic.rendering" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
